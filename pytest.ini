# `pytest` from the repo root runs the whole suite in parallel (pytest-xdist,
# one worker per core): ~95s serial → ~20s on 12 cores. Most of the time is
# the refresh/verify tests spawning the real compute sandbox + check.py.
# Debugging (pdb, print, one test): add `-n0` to run in-process, serially.
[pytest]
testpaths = services
pythonpath = .
addopts = -n auto

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/services/page_builder"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns:
          - "*"

  # Root requirements.txt + requirements-dev.txt (ruff). ruff gets its own
  # PR: CI fails it until `required-version` in ruff.toml is bumped to match
  # and the new version's findings are fixed, and that shouldn't hold back
  # the other root pins.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      ruff:
        patterns:
          - "ruff"
      pip-root:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"

  - package-ecosystem: "pip"
    directory: "/services/news"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-news:
        patterns:
          - "*"

  # Base images: Dockerfile (builder) and infra/Dockerfile.publisher.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-publisher:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

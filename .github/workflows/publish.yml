# Publish govil.ai: GCS pages + Firestore artifacts → nuxt generate → Firebase.
#
# Two triggers:
#   - push to main touching the frontend/publisher → push-to-deploy
#   - workflow_dispatch → fired by the govdata-builder-job after a run that
#     re-rendered ≥1 page (services/page_builder/pipeline.py::_trigger_publish_github,
#     PUBLISH_VIA=github)
#     and available for manual runs from the Actions tab.
#
# Bursts collapse: the `publish-live` concurrency group cancels the in-flight
# run when a newer one starts, so N rapid site updates cost one deploy.
#
# Auth is keyless via Workload Identity Federation (infra/github-ci.setup.sh):
# the govdata-ci service account can read Firestore + the staging bucket and
# deploy Firebase Hosting — nothing else.
name: publish

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "services/__init__.py"
      - "services/page_builder/__init__.py"
      - "services/page_builder/publish.py"
      - "services/news/__init__.py"
      - "services/news/publish_news.py"
      - "services/news/store.py"
      - "services/page_builder/dataset_successors.json"
      - "services/page_builder/legacy_page_slugs.json"
      - "services/page_builder/related.py"
      - "services/page_builder/tags.py"
      - "services/page_builder/schema.py"
      - "taxonomy/**"
      - "services/page_builder/requirements-publish.txt"
      - "services/shared/**"
      - "firebase.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

concurrency:
  group: publish-live
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # WIF OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT }}
      STAGING_BUCKET: ${{ vars.GCS_STAGING_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache key for the installed frontend deps, hashed now, before
      # node_modules is restored (hashFiles would otherwise walk ~1,200
      # packages).
      - name: Hash frontend lockfile
        id: frontend-hash
        run: |
          echo "lock=${{ hashFiles('frontend/package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: true

      # Delta fetch: the cache carries the previous run's pages, so rsync
      # only moves new/changed objects. Cache key always misses (run id) —
      # restore-keys pulls the most recent snapshot, then we save ours.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/public/datasets
          # `datasets-live-` is the prefix the removed preview lane's per-lane
          # key resolved to for live runs; keep it so the existing cache hits.
          key: datasets-live-${{ github.run_id }}
          restore-keys: |
            datasets-live-

      - name: Fetch agent pages from staging
        run: |
          mkdir -p frontend/public/datasets
          gcloud storage rsync "gs://${STAGING_BUCKET}/datasets/" frontend/public/datasets/ \
            --recursive --delete-unmatched-destination-objects \
            --exclude='.*/(data|agent_data)\.json$|.*/index\.html$'

      # The cache restored the previous run's publisher output, which rsync
      # neither updates nor deletes (excluded above). Drop it so only what
      # the publisher writes below is deployed, as in infra/sync-datasets.sh.
      - name: Drop cached publisher JSON
        run: |
          find frontend/public/datasets \( -name 'data.json' -o -name 'agent_data.json' \) -delete

      # News images (services/news); the publisher then writes the article
      # JSON next to them and removes directories of articles not live.
      # A failed rsync fails the run: this directory isn't cached, so going on
      # would deploy every article without its images. rsync errors on a
      # source prefix with no objects, so a bucket with no news/ yet (a fork,
      # a fresh project) is skipped by listing the bucket root first; a failed
      # listing fails the run too (the assignment carries its exit status).
      - name: Fetch news images from staging
        run: |
          mkdir -p frontend/public/news
          top="$(gcloud storage ls "gs://${STAGING_BUCKET}/")"
          if grep -qxF "gs://${STAGING_BUCKET}/news/" <<<"$top"; then
            gcloud storage rsync "gs://${STAGING_BUCKET}/news/" frontend/public/news/ \
              --recursive --delete-unmatched-destination-objects \
              --exclude='.*\.json$|.*/index\.html$'
          else
            echo "no gs://${STAGING_BUCKET}/news/ yet; no news images to fetch"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/page_builder/requirements-publish.txt

      - name: Publish artifacts from Firestore
        run: |
          pip install -q -r services/page_builder/requirements-publish.txt
          python -m services.page_builder.publish --from-firestore \
            --out frontend/public/
        env:
          PYTHONPATH: ${{ github.workspace }}
          FIRESTORE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT }}

      # No recipe sync here: the nightly refresh reads recipes/ straight from
      # git main (services/page_builder/refresh.py::GithubRecipeRepo), so
      # this workflow keeps read-only access to the staging bucket.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          # Pin exact patch: Node 22.23.0 shipped a keep-alive socket-reuse
          # regression (nodejs/node#63989) that breaks WIF/ADC token exchange,
          # surfacing as "Failed to authenticate" on firebase deploy. 22.22.3
          # is the last good release. Revisit when a 22.x patch fixes it.
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installed deps, keyed on the lockfile + OS + the exact Node the
      # setup-node step resolved. An exact hit skips `npm ci` (and its
      # postinstall `nuxt prepare`, which `nuxt generate` redoes anyway).
      # node_modules/.cache (build scratch) is never part of this cache.
      - name: Restore frontend node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/node_modules
            !frontend/node_modules/.cache
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ steps.frontend-hash.outputs.lock }}

      - name: Install frontend dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 10000
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && break
            if [ "$i" -eq 3 ]; then
              echo "npm ci failed 3 times; giving up" >&2
              exit 1
            fi
            echo "npm ci retry $i/3"
            sleep 10
          done

      # No Nuxt build cache here on purpose. `nuxt generate` clears its build
      # dir, so caching .nuxt saves nothing, and `experimental.buildCache`
      # (which would skip ~95s of bundling) is unsafe for this site: Tailwind
      # scans public/datasets/**/*.html, Nuxt's cache key ignores public/, so
      # a class first used by a new page would ship without its CSS rule
      # (reproduced 2026-11-12; see TODO.md).
      - name: Generate site
        working-directory: frontend
        run: |
          npm run generate
        env:
          # Optional analytics/ads — repo variables, unset in forks (the
          # generated site then contains no GA/AdSense/Clarity at all).
          NUXT_PUBLIC_GTAG_ID: ${{ vars.NUXT_PUBLIC_GTAG_ID }}
          NUXT_PUBLIC_ADSENSE_ID: ${{ vars.NUXT_PUBLIC_ADSENSE_ID }}
          NUXT_PUBLIC_CLARITY_ID: ${{ vars.NUXT_PUBLIC_CLARITY_ID }}

      # Rebuild hosting.redirects from the fresh manifest so old dataset-uuid
      # and old tag URLs keep 301-ing to their current slug instead of 404-ing.
      # Runs after publish (manifest written) + generate, before deploy reads
      # firebase.json.
      - name: Regenerate redirects from manifest
        run: node frontend/scripts/gen-redirects.mjs

      # IndexNow baseline: the sitemap live right before this deploy, so the
      # ping submits only new URLs and URLs whose <lastmod> moved. Fail-soft
      # (the script always exits 0; no file → IndexNow submits every URL).
      - name: Fetch live sitemap (IndexNow baseline)
        continue-on-error: true
        run: node frontend/scripts/fetch-live-sitemap.mjs "$RUNNER_TEMP/live-sitemap.xml"

      - name: Deploy to Firebase Hosting
        run: |
          ./frontend/node_modules/.bin/firebase deploy --only hosting \
            --project "${PROJECT}" --non-interactive

      # Tell Bing/Yandex/etc. about new and changed URLs right after deploy
      # (IndexNow). Key file ships in frontend/public/; failures never block
      # the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: node frontend/scripts/indexnow-ping.mjs --previous "$RUNNER_TEMP/live-sitemap.xml"

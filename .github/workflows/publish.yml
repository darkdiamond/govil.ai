# Publish govil.ai: GCS pages + Firestore artifacts → nuxt generate → Firebase.
#
# Two triggers:
#   - push to main touching the frontend/publisher → push-to-deploy
#   - workflow_dispatch → fired by the govdata-builder after agent runs
#     (services/page_builder/pipeline.py::_trigger_publish, PUBLISH_VIA=github)
#     and available for manual runs from the Actions tab.
#
# Bursts collapse: the `publish` concurrency group cancels the in-flight
# run when a newer one starts, so N rapid site updates cost one deploy.
#
# target=preview (workflow_dispatch input, fired by the govdata-refresh-preview
# job) builds the same site, overlays the recipe-refresh demo lane
# (gs://…/preview/datasets/ + Firestore preview_sources) and deploys it to the
# `recipes-demo` Hosting preview CHANNEL — never to live. It runs from this
# file on main, so the WIF binding (scoped to publish.yml@main) still applies.
#
# Auth is keyless via Workload Identity Federation (infra/github-ci.setup.sh):
# the govdata-ci service account can read Firestore + the staging bucket and
# deploy Firebase Hosting — nothing else.
name: publish

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "services/page_builder/publish.py"
      - "services/page_builder/related.py"
      - "services/page_builder/schema.py"
      - "services/page_builder/requirements-publish.txt"
      - "services/shared/**"
      - "firebase.json"
      - "recipes/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "live, or preview (recipe-refresh demo channel)"
        type: choice
        options: [live, preview]
        default: live

concurrency:
  # Separate lanes: a demo publish must never cancel a live deploy.
  group: publish-${{ inputs.target || 'live' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # WIF OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT }}
      STAGING_BUCKET: ${{ vars.GCS_STAGING_BUCKET }}
      TARGET: ${{ inputs.target || 'live' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: true

      # Delta fetch: the cache carries the previous run's pages, so rsync
      # only moves new/changed objects. Cache key always misses (run id) —
      # restore-keys pulls the most recent snapshot, then we save ours.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/public/datasets
          # Per-lane keys: the cache is saved AFTER the preview overlay has
          # written demo content.html into this tree, so a shared key would
          # let a live run restore demo pages (and rsync could skip them).
          key: datasets-${{ inputs.target || 'live' }}-${{ github.run_id }}
          restore-keys: |
            datasets-${{ inputs.target || 'live' }}-

      - name: Fetch agent pages from staging
        run: |
          mkdir -p frontend/public/datasets
          gcloud storage rsync "gs://${STAGING_BUCKET}/datasets/" frontend/public/datasets/ \
            --recursive --delete-unmatched-destination-objects \
            --exclude='.*/(data|agent_data)\.json$|.*/index\.html$'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/page_builder/requirements-publish.txt

      - name: Publish artifacts from Firestore
        run: |
          pip install -q -r services/page_builder/requirements-publish.txt
          python -m services.page_builder.publish --from-firestore \
            --out frontend/public/
        env:
          PYTHONPATH: ${{ github.workspace }}
          FIRESTORE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT }}

      # Recipes are reviewed in git; the nightly refresh reads them from
      # GCS. Live lane only — demo recipes live under preview/recipes/.
      - name: Sync recipes to staging
        if: env.TARGET == 'live'
        run: |
          if [ -d recipes ]; then
            gcloud storage rsync recipes/ "gs://${STAGING_BUCKET}/recipes/" \
              --recursive --delete-unmatched-destination-objects
          fi

      - name: Overlay recipe-refresh demo lane
        if: env.TARGET == 'preview'
        run: |
          gcloud storage rsync "gs://${STAGING_BUCKET}/preview/datasets/" frontend/public/datasets/ \
            --recursive
          python -m services.page_builder.refresh overlay --out frontend/public/
          # A public preview URL must not compete with govil.ai in search.
          printf 'User-agent: *\nDisallow: /\n' > frontend/public/robots.txt
        env:
          PYTHONPATH: ${{ github.workspace }}
          FIRESTORE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Pin exact patch: Node 22.23.0 shipped a keep-alive socket-reuse
          # regression (nodejs/node#63989) that breaks WIF/ADC token exchange,
          # surfacing as "Failed to authenticate" on firebase deploy. 22.22.3
          # is the last good release. Revisit when a 22.x patch fixes it.
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate site
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run generate
        env:
          # Optional analytics/ads — repo variables, unset in forks (the
          # generated site then contains no GA/AdSense/Clarity at all).
          NUXT_PUBLIC_GTAG_ID: ${{ vars.NUXT_PUBLIC_GTAG_ID }}
          NUXT_PUBLIC_ADSENSE_ID: ${{ vars.NUXT_PUBLIC_ADSENSE_ID }}
          NUXT_PUBLIC_CLARITY_ID: ${{ vars.NUXT_PUBLIC_CLARITY_ID }}

      # Rebuild hosting.redirects from the fresh manifest so old dataset-uuid
      # and old tag URLs keep 301-ing to their current slug instead of 404-ing.
      # Runs after publish (manifest written) + generate, before deploy reads
      # firebase.json.
      - name: Regenerate redirects from manifest
        run: node frontend/scripts/gen-redirects.mjs

      - name: Deploy to Firebase Hosting
        if: env.TARGET == 'live'
        run: |
          ./frontend/node_modules/.bin/firebase deploy --only hosting \
            --project "${PROJECT}" --non-interactive

      # Tell Bing/Yandex/etc. about every URL right after deploy (IndexNow).
      # Key file ships in frontend/public/; failures never block the deploy.
      - name: Deploy recipe-refresh demo channel
        if: env.TARGET == 'preview'
        run: |
          ./frontend/node_modules/.bin/firebase hosting:channel:deploy recipes-demo \
            --expires 30d --project "${PROJECT}" --non-interactive

      - name: Ping IndexNow
        if: env.TARGET == 'live'
        continue-on-error: true
        run: node frontend/scripts/indexnow-ping.mjs

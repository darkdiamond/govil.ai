# CI gate for pull requests (and pushes to main). Validates that a change —
# notably the grouped Dependabot bumps — doesn't break the two things that
# actually ship: the Python services and the static Nuxt build.
#
# Cost-efficient by construction:
#   - `changes` filter runs each job only when its files moved, so an
#     actions-only or pip-only PR never pays for a Node build (and vice versa).
#   - concurrency cancels superseded runs on rapid pushes (one PR, one run).
#   - pip + npm caches keyed on the lockfiles make repeat installs cheap.
#   - the `ci` aggregate job is one stable status name to require in branch
#     protection / Dependabot auto-merge, and it passes correctly when a path
#     job is skipped.
#
# Both checks mirror production exactly: `pytest services/` is the suite, and
# `npm run generate` is the same command the publisher runs (nuxt generate +
# sitemap). The build degrades gracefully without Firestore data (nuxt.config
# returns [] routes, build-sitemap emits a static-only map), so a bare PR
# checkout still exercises Vite, Tailwind, vue-router and TypeScript — enough
# to catch a breaking dependency bump before it reaches main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter calls the PR listFiles API on pull_request events;
  # without this it fails with "Resource not accessible by integration".
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - 'services/**'
              - 'recipes/**'
              - 'agent/**'
              - 'requirements.txt'
              - 'requirements-dev.txt'
              - 'ruff.toml'
              - 'pytest.ini'
              - '.github/workflows/ci.yml'
              # Read by the contract-parity and publish-path tests
              # (services/page_builder/tests/test_contract_parity.py,
              # test_publish_paths.py, scanner/tests/test_models.py).
              - 'frontend/types/manifest.ts'
              - 'frontend/utils/search-index.ts'
              - 'frontend/nuxt.config.ts'
              - 'frontend/tests/fixtures/**'
              - 'cloudbuild-publish.yaml'
              - 'infra/publish-local.sh'
              - '.github/workflows/publish.yml'
              # Read by test_hosting_cache.py and test_tags.py.
              - 'firebase.json'
              - 'taxonomy/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            services/page_builder/requirements.txt
            services/news/requirements.txt
      - name: Install dependencies
        # Root + builder + news requirements cover every import in the suite
        # (news' brings duckdb, so its query tests run here instead of
        # skipping); every test mocks Firestore, so no emulator is needed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r services/page_builder/requirements.txt -r services/news/requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        # Same check `author verify` runs per recipe; config + pinned version in ruff.toml.
        run: ruff check . --output-format github
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest services/ -q

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Unit tests
        # Same command as the root `npm test` script and the husky hook.
        working-directory: frontend
        run: node --test tests/*.test.mjs
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Build (production parity)
        working-directory: frontend
        run: npm run generate

  # Single required status check. `if: always()` so it still evaluates when a
  # path job was skipped; fails if any needed job failed or was cancelled.
  ci:
    if: always()
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        # RESULTS is a space-joined list of GitHub-controlled job results
        # (success/failure/skipped/cancelled), passed via env rather than
        # interpolated into the script per workflow-injection guidance.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "A required CI job failed or was cancelled."
            exit 1
          fi
          echo "All CI jobs passed (or were skipped)."

# Cloud Build pipeline — regenerate manifest, build Nuxt site, deploy to
# Firebase Hosting. Fallback publisher (PUBLISH_VIA=cloudbuild): triggered by
# govdata-builder-job after a run that re-rendered ≥1 page (see
# services/page_builder/pipeline.py::_trigger_publish).
#
# Must do what .github/workflows/publish.yml (the primary path) does: pages +
# news images from staging, publish from Firestore, nuxt generate with the
# analytics IDs, gen-redirects, firebase deploy, IndexNow.
# services/page_builder/tests/test_publish_paths.py checks the three paths
# (this file, publish.yml, infra/publish-local.sh) for each of those steps.
#
# Uses a pre-baked image built by cloudbuild-publisher-image.yaml — it
# carries node 22, firebase-tools, gsutil, page_builder Python deps, and
# frontend/node_modules. That lets every step run on the same image
# (single pull) and skips `npm ci` + firebase-tools install on every
# publish.
#
# Substitutions:
#   _STAGING_BUCKET    GCS bucket the builder stages rendered pages to
#   _FIREBASE_PROJECT  Firebase / GCP project that owns Hosting + Firestore
#   _PUBLISHER_IMAGE   Pre-baked image (see cloudbuild-publisher-image.yaml)
#   _GTAG_ID, _ADSENSE_ID, _CLARITY_ID
#                      Analytics/ads IDs → NUXT_PUBLIC_GTAG_ID / _ADSENSE_ID /
#                      _CLARITY_ID at generate time. Empty by default (kept
#                      out of the repo, like publish.yml's repo variables): set
#                      them on the trigger, or the site ships with no GA,
#                      AdSense or Clarity at all:
#                        gcloud builds triggers update manual govdata-publish \
#                          --update-substitutions=_GTAG_ID=…,_ADSENSE_ID=…,_CLARITY_ID=…

steps:
  # [1] Pull only the agent's content.html (and any extras) from staging.
  #     The structured JSON files (data.json, agent_data.json) are written
  #     in step [2] from Firestore — never synced from GCS. The `-x` regex
  #     excludes those filenames + index.html so even if a pre-split-era
  #     stale copy lingers in staging, rsync won't drag it into the deploy.
  - id: "fetch-pages"
    name: "${_PUBLISHER_IMAGE}"
    entrypoint: "bash"
    waitFor: ["-"]
    args:
      - "-c"
      - |
        set -euo pipefail
        mkdir -p frontend/public/datasets
        gsutil -m rsync -r \
          -x '.*/(data|agent_data)\.json$|.*/index\.html$' \
          "gs://${_STAGING_BUCKET}/datasets/" frontend/public/datasets/
        # News images (services/news); the publisher then writes the article
        # JSON next to them and removes directories of articles not live.
        # A failed rsync fails the build (no images → broken articles). rsync
        # errors on a source prefix with no objects, so a bucket with no news/
        # yet (a fork, a fresh project) is skipped by listing the bucket root;
        # a failed listing fails the build too (set -e on the assignment).
        mkdir -p frontend/public/news
        top="$(gsutil ls "gs://${_STAGING_BUCKET}/")"
        if grep -qxF "gs://${_STAGING_BUCKET}/news/" <<<"$top"; then
          gsutil -m rsync -r -d \
            -x '.*\.json$|.*/index\.html$' \
            "gs://${_STAGING_BUCKET}/news/" frontend/public/news/
        else
          echo "no gs://${_STAGING_BUCKET}/news/ yet; no news images to fetch"
        fi

  # [2] Emit per-dataset data.json + agent_data.json + aggregated manifest.json
  #     from Firestore — single source of truth.
  #     waitFor:['fetch-pages']: deterministic ordering. publish.py writes
  #     after the rsync, so even if stale data.json files ever slip past
  #     step [1]'s `-x` filter (or get re-uploaded by some future code path),
  #     this step's writes overwrite them. Belt-and-suspenders with the rsync
  #     exclusion above.
  - id: "publish-artifacts"
    name: "${_PUBLISHER_IMAGE}"
    entrypoint: "bash"
    waitFor: ["fetch-pages"]
    env:
      - "FIRESTORE_PROJECT_ID=${_FIREBASE_PROJECT}"
      - "GOOGLE_CLOUD_PROJECT=${_FIREBASE_PROJECT}"
    args:
      - "-c"
      - |
        set -euo pipefail
        mkdir -p frontend/public/data frontend/public/datasets
        python3 -m services.page_builder.publish \
          --from-firestore \
          --out frontend/public/

  # [3] nuxt generate + firebase deploy, in one step on the pre-baked image.
  #     Reuses /opt/frontend-deps/node_modules when package-lock matches the
  #     image; falls back to `npm ci` if the lock has drifted (rebuild the
  #     image via cloudbuild-publisher-image.yaml to restore the fast path).
  #     Restores frontend/node_modules/.cache from GCS keyed by
  #     md5(package-lock.json) to warm Vite/Nitro between builds; cache is
  #     best-effort so a miss or transient GCS error never breaks deploy.
  - id: "generate-and-deploy"
    name: "${_PUBLISHER_IMAGE}"
    entrypoint: "bash"
    env:
      # Optional analytics/ads; empty → the generated site has none of them.
      - "NUXT_PUBLIC_GTAG_ID=${_GTAG_ID}"
      - "NUXT_PUBLIC_ADSENSE_ID=${_ADSENSE_ID}"
      - "NUXT_PUBLIC_CLARITY_ID=${_CLARITY_ID}"
    args:
      - "-c"
      - |
        set -euo pipefail
        cd frontend
        # NB: bash ALL_CAPS dollar-references get parsed as Cloud Build
        # substitutions (and rejected) — use lowercase locals.
        # Empty analytics substitutions: warn, don't fail (forks have none).
        [ -n "${_GTAG_ID}" ] || echo "WARNING: substitution _GTAG_ID is empty; the site ships without Google Analytics (set it on the trigger)"
        [ -n "${_ADSENSE_ID}" ] || echo "WARNING: substitution _ADSENSE_ID is empty; the site ships without AdSense (set it on the trigger)"
        [ -n "${_CLARITY_ID}" ] || echo "WARNING: substitution _CLARITY_ID is empty; the site ships without Clarity (set it on the trigger)"
        if [ -f /opt/frontend-deps/package-lock.json ] \
           && [ "$(md5sum < /opt/frontend-deps/package-lock.json | cut -d' ' -f1)" \
              = "$(md5sum < package-lock.json | cut -d' ' -f1)" ]; then
          echo "package-lock.json matches image; reusing pre-baked node_modules"
          cp -a /opt/frontend-deps/node_modules node_modules
        else
          echo "package-lock.json differs from image; running npm ci (rebuild publisher image to restore fast path)"
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 10000
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit && break
            if [ "$i" -eq 3 ]; then
              echo "npm ci failed 3 times; giving up" >&2
              exit 1
            fi
            echo "npm ci retry $i/3"
            sleep 10
          done
        fi

        # Build cache: keyed by md5(package-lock.json) so dependency drift
        # busts the cache automatically. Restore is best-effort — a miss or
        # error never blocks the deploy.
        # We cache .nuxt (prepare/build artifacts) + node_modules/.cache
        # (Vite prebundle), but NEVER .output: that's the deployable, and a
        # stale restore would publish old pages.
        lock_hash=$(md5sum < package-lock.json | cut -d' ' -f1)
        cache_uri="gs://${_STAGING_BUCKET}/build-cache/$lock_hash/nuxt-cache.tar.zst"
        if gsutil -q stat "$cache_uri" 2>/dev/null; then
          echo "restoring nuxt build cache from $cache_uri"
          if gsutil cat "$cache_uri" | tar -I zstd -xf -; then
            echo "cache restored"
          else
            echo "cache restore failed, continuing cold"
            rm -rf node_modules/.cache .nuxt
          fi
        else
          echo "no nuxt build cache at $cache_uri (cold start)"
        fi

        npm run generate

        # Save cache after a successful generate; non-fatal on error.
        cache_paths=""
        [ -d node_modules/.cache ] && cache_paths="$cache_paths node_modules/.cache"
        [ -d .nuxt ] && cache_paths="$cache_paths .nuxt"
        if [ -n "$cache_paths" ]; then
          echo "saving nuxt build cache to $cache_uri"
          if tar -I 'zstd -T0 -3' -cf - $cache_paths | gsutil -q cp - "$cache_uri"; then
            echo "cache saved"
          else
            echo "cache save failed (non-fatal)"
          fi
        fi

        cd ..
        # Rebuild hosting.redirects from the fresh manifest (old dataset-uuid
        # and tag URLs 301 to their current slug), before deploy reads
        # firebase.json.
        node frontend/scripts/gen-redirects.mjs

        firebase deploy \
          --only hosting \
          --project "${_FIREBASE_PROJECT}" \
          --non-interactive

  # [4] Tell Bing/Yandex/etc. about every URL right after deploy (IndexNow).
  #     Reads frontend/.output/public/sitemap.xml from the shared workspace;
  #     a failure never fails the build.
  - id: "indexnow"
    name: "${_PUBLISHER_IMAGE}"
    entrypoint: "bash"
    waitFor: ["generate-and-deploy"]
    allowFailure: true
    args:
      - "-c"
      - |
        node frontend/scripts/indexnow-ping.mjs

substitutions:
  _STAGING_BUCKET: "govdata-il-staging"
  _FIREBASE_PROJECT: "govdata-il"
  _PUBLISHER_IMAGE: "me-west1-docker.pkg.dev/govdata-il/publisher/publisher:latest"
  _GTAG_ID: ""
  _ADSENSE_ID: ""
  _CLARITY_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY
  # Default machineType (e2-standard-2). Nuxt generate is single-thread
  # bound; the prior E2_HIGHCPU_8 was wasted CPU and 5x billing.

timeout: "1800s"
